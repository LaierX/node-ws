<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宋代禅诗赏析 - 《颂》</title>
    <style>
        :root {
            --bg-color: #f9f7f2; /* 宣纸色 */
            --text-color: #2c3e50;
            --accent-green: #68945c; /* 春水绿 */
            --accent-red: #c04851; /* 野花红 */
            --border-color: #d1c7b7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "LXGW WenKai", "Microsoft YaHei", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid var(--border-color);
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 80%;
            position: relative;
        }

        /* 装饰边角 */
        .container::before, .container::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
        }
        .container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 10px;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .author {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .author::before, .author::after {
            content: "";
            width: 30px;
            height: 1px;
            background-color: var(--border-color);
        }

        .content {
            font-size: 1.8rem;
            line-height: 2.2;
            writing-mode: vertical-rl; /* 竖排文字 */
            margin: 0 auto;
            height: 300px;
            text-align: left;
            letter-spacing: 5px;
        }

        .line-1 { color: var(--accent-green); }
        .line-2 { color: var(--accent-red); }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #888;
            line-height: 1.6;
        }

        .stamp {
            margin-top: 20px;
            color: var(--accent-red);
            font-weight: bold;
            border: 2px solid var(--accent-red);
            display: inline-block;
            padding: 2px 5px;
            transform: rotate(-5deg);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>颂</h1>
            <div class="author">宋 · 宗慧</div>
        </header>

        <div class="content">
            <div class="line-1">一池春水绿，</div>
            <div class="line-2">两岸野花红。</div>
            <div class="line-3">要识本来面，</div>
            <div class="line-4">且看这一重。</div>
        </div>

        <footer>
            <p>“既入世体验万物生机，<br>又在当下观照本心。”</p>
            <div class="stamp">宗慧禅师</div>
        </footer>
    </div>

</body>
</html>
